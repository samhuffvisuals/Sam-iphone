<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Leads</title>
<meta name="description" content="Track video project leads and tag them Hot, Warm or Cold.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leads">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-2: #fafafa;
    --surface: #efefef;
    --text: #0c1014;
    --muted: #737373;
    --line: #dbdbdb;
    --blue: #0095f6;
    --sheet: #ffffff;
    --backdrop: rgba(0,0,0,.4);
    --hot: #ff3040;
    --warm: #ff9f0a;
    --cold: #2f8cff;
    --hot-grad: linear-gradient(135deg, #ff7a18 0%, #ff3040 55%, #d6247a 100%);
    --warm-grad: linear-gradient(135deg, #ffd25a 0%, #ff9f0a 60%, #ff6a00 100%);
    --cold-grad: linear-gradient(135deg, #7fd6ff 0%, #2f8cff 55%, #5b4bdb 100%);
    --ig-grad: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --bg-2: #0c0c0c;
      --surface: #262626;
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --line: #262626;
      --sheet: #1c1c1e;
      --backdrop: rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }
  svg { display: block; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    padding: calc(var(--safe-top) + 6px) 16px 6px;
    background: var(--bg);
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid transparent;
  }
  .topbar.scrolled { border-bottom-color: var(--line); }
  .logo { font-family: "Grand Hotel", "Snell Roundhand", cursive; font-size: 32px; line-height: 44px; letter-spacing: .2px; }
  .topbar .actions { display: flex; gap: 20px; }
  .icon-btn { width: 28px; height: 28px; display: grid; place-items: center; }
  .icon-btn svg { width: 26px; height: 26px; }

  /* ---------- Views ---------- */
  main { padding-bottom: calc(60px + var(--safe-bottom)); }
  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Stories (filters) ---------- */
  .stories {
    display: flex; gap: 14px; overflow-x: auto; padding: 8px 12px 12px;
    border-bottom: 1px solid var(--line); scrollbar-width: none;
  }
  .stories::-webkit-scrollbar { display: none; }
  .story { flex: 0 0 auto; width: 74px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .story .ring {
    width: 70px; height: 70px; border-radius: 50%; padding: 3px;
    background: var(--line); display: grid; place-items: center;
    transition: transform .15s;
  }
  .story:active .ring { transform: scale(.94); }
  .story .ring > div {
    width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg);
    display: grid; place-items: center; font-size: 26px; background: var(--surface); position: relative;
  }
  .story[data-f="all"] .ring { background: var(--ig-grad); }
  .story[data-f="hot"] .ring { background: var(--hot-grad); }
  .story[data-f="warm"] .ring { background: var(--warm-grad); }
  .story[data-f="cold"] .ring { background: var(--cold-grad); }
  .story:not(.selected):not(.new) .ring { opacity: .45; }
  .story.selected .label { font-weight: 600; }
  .story .label { font-size: 12px; max-width: 74px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .story .count {
    position: absolute; right: -4px; bottom: -2px; min-width: 22px; height: 22px; padding: 0 6px;
    border-radius: 11px; background: var(--text); color: var(--bg); font-size: 12px; font-weight: 700;
    display: grid; place-items: center; border: 2px solid var(--bg);
  }
  .story.new .ring { background: transparent; padding: 0; }
  .story.new .ring > div { border: 0; background: var(--surface); }
  .story.new .plus {
    position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; border-radius: 50%;
    background: var(--blue); color: #fff; display: grid; place-items: center; border: 2px solid var(--bg);
    font-size: 16px; font-weight: 700; line-height: 1;
  }

  /* ---------- Lead list (follower-list style) ---------- */
  .list-head { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 16px 6px; }
  .list-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .list-head span { font-size: 13px; color: var(--muted); }
  .lead { display: flex; align-items: center; gap: 12px; padding: 8px 16px; animation: pop .25s ease-out; }
  .lead:active { background: var(--bg-2); }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .lead .open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; }
  .lead .who { flex: 1; min-width: 0; }
  .lead .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lead .sub { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lead .money { color: var(--text); }
  .temp-btn {
    flex: 0 0 auto; height: 32px; min-width: 84px; padding: 0 14px; border-radius: 8px;
    font-size: 14px; font-weight: 600; color: #fff; transition: transform .12s;
  }
  .temp-btn:active { transform: scale(.94); }
  .temp-btn.hot { background: var(--hot); } .temp-btn.warm { background: var(--warm); } .temp-btn.cold { background: var(--cold); }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%; padding: 2px; flex: 0 0 auto; background: var(--line);
  }
  .avatar > span, .avatar > img {
    width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--bg); background: var(--surface);
    display: grid; place-items: center; font-size: 17px; font-weight: 700; letter-spacing: .3px; object-fit: cover;
  }
  .t-hot .avatar, .avatar.t-hot { background: var(--hot-grad); }
  .t-warm .avatar, .avatar.t-warm { background: var(--warm-grad); }
  .t-cold .avatar, .avatar.t-cold { background: var(--cold-grad); }

  .empty { text-align: center; padding: 64px 32px; color: var(--muted); }
  .empty .big-ring { width: 96px; height: 96px; border-radius: 50%; border: 2px solid var(--text); margin: 0 auto 18px; display: grid; place-items: center; color: var(--text); }
  .empty .big-ring svg { width: 44px; height: 44px; }
  .empty h2 { color: var(--text); font-size: 24px; font-weight: 800; margin: 0 0 8px; }
  .empty p { margin: 0 0 18px; }
  .link-btn { color: var(--blue); font-weight: 600; font-size: 15px; }

  /* ---------- Search ---------- */
  .search-wrap { padding: 8px 12px; position: sticky; top: calc(var(--safe-top) + 56px); background: var(--bg); z-index: 10; }
  .search {
    display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 10px; height: 38px; padding: 0 12px;
  }
  .search svg { width: 16px; height: 16px; color: var(--muted); flex: 0 0 auto; }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px; min-width: 0; }

  /* ---------- Profile ---------- */
  .profile { padding: 12px 16px 0; }
  .profile-top { display: flex; align-items: center; gap: 24px; }
  .profile .pic { width: 86px; height: 86px; border-radius: 50%; padding: 3px; background: var(--ig-grad); flex: 0 0 auto; }
  .profile .pic > img { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg); display: block; }
  .stats { flex: 1; display: flex; justify-content: space-around; text-align: center; }
  .stats b { display: block; font-size: 18px; font-weight: 700; }
  .stats span { font-size: 13px; }
  .bio { margin: 12px 0; font-size: 14px; }
  .bio b { display: block; }
  .bio span { color: var(--muted); }
  .btn-row { display: flex; gap: 6px; margin-bottom: 14px; }
  .btn-gray { flex: 1; height: 34px; border-radius: 8px; background: var(--surface); font-weight: 600; font-size: 14px; }
  .btn-gray:active { opacity: .7; }
  .grid-tabs { display: flex; border-top: 1px solid var(--line); }
  .grid-tabs div { flex: 1; display: grid; place-items: center; height: 44px; border-top: 1px solid var(--text); margin-top: -1px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .tile {
    aspect-ratio: 3 / 4; color: #fff; padding: 8px; display: flex; flex-direction: column; justify-content: flex-end;
    text-align: left; overflow: hidden; position: relative; background: var(--surface);
  }
  .tile.hot { background: var(--hot-grad); } .tile.warm { background: var(--warm-grad); } .tile.cold { background: var(--cold-grad); }
  .tile.has-photo { background-size: cover; background-position: center; }
  .tile .e { position: absolute; top: 6px; right: 8px; font-size: 16px; }
  .tile b { font-size: 13px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile span { font-size: 11px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Tab bar ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    height: calc(50px + var(--safe-bottom)); padding-bottom: var(--safe-bottom);
    background: var(--bg); border-top: 1px solid var(--line);
    display: flex; justify-content: space-around; align-items: center;
  }
  .tabbar button { flex: 1; height: 50px; display: grid; place-items: center; }
  .tabbar svg { width: 26px; height: 26px; }
  .tabbar .me { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; border: 2px solid transparent; }
  .tabbar .me img { width: 100%; height: 100%; display: block; }
  .tabbar button.active .me { border-color: var(--text); }
  .tabbar .fill { display: none; }
  .tabbar button.active .fill { display: block; }
  .tabbar button.active .outline { display: none; }

  /* ---------- Sheet ---------- */
  .backdrop {
    position: fixed; inset: 0; background: var(--backdrop); z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    max-height: calc(100% - var(--safe-top) - 24px);
    background: var(--sheet); border-radius: 14px 14px 0 0;
    transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column;
  }
  .sheet.open { transform: none; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 6px auto 0; }
  .sheet-head {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .sheet-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .sheet-head .left { justify-self: start; font-size: 16px; }
  .sheet-head .right { justify-self: end; font-size: 16px; font-weight: 700; color: var(--blue); }
  .sheet-head .right:disabled { opacity: .4; }
  .sheet-body { overflow-y: auto; padding: 14px 16px calc(20px + var(--safe-bottom)); -webkit-overflow-scrolling: touch; }
  .temp-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .temp-pick button {
    height: 64px; border-radius: 14px; border: 2px solid var(--line); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; font-weight: 700; font-size: 14px;
    transition: transform .12s;
  }
  .temp-pick button:active { transform: scale(.95); }
  .temp-pick button .e { font-size: 22px; line-height: 1; }
  .temp-pick button.on { color: #fff; border-color: transparent; }
  .temp-pick button.on[data-t="hot"] { background: var(--hot-grad); }
  .temp-pick button.on[data-t="warm"] { background: var(--warm-grad); }
  .temp-pick button.on[data-t="cold"] { background: var(--cold-grad); }
  .field { border-bottom: 1px solid var(--line); padding: 10px 0; display: flex; align-items: center; gap: 12px; }
  .field label { width: 92px; flex: 0 0 auto; font-size: 15px; }
  .field input, .field textarea, .field select {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; padding: 4px 0;
  }
  .field textarea { resize: none; min-height: 72px; }
  .field.top { align-items: flex-start; }
  .field.top label { padding-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0 4px; }
  .chip { padding: 6px 12px; border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 600; }
  .chip.on { background: var(--text); color: var(--bg); }
  .photo-pick { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 2px 0 16px; }
  .photo-pick .avatar { width: 92px; height: 92px; padding: 3px; }
  .photo-pick .avatar > span, .photo-pick .avatar > img { font-size: 30px; border-width: 3px; }
  .photo-pick .links { display: flex; gap: 18px; }
  .photo-pick .links button { color: var(--blue); font-weight: 600; font-size: 14px; }
  .photo-pick .links .remove { color: var(--muted); }
  .danger { color: var(--hot); font-weight: 600; width: 100%; text-align: center; padding: 18px 0 6px; font-size: 15px; }

  /* ---------- Action sheet / toast ---------- */
  .actions-sheet {
    position: fixed; left: 8px; right: 8px; bottom: calc(8px + var(--safe-bottom)); z-index: 55;
    transform: translateY(120%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column; gap: 8px;
  }
  .actions-sheet.open { transform: none; }
  .actions-sheet .group { background: var(--sheet); border-radius: 14px; overflow: hidden; }
  .actions-sheet .title { text-align: center; font-size: 13px; color: var(--muted); padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  .actions-sheet .group button {
    width: 100%; height: 56px; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 8px;
    border-bottom: 1px solid var(--line);
  }
  .actions-sheet .group button:last-child { border-bottom: 0; }
  .actions-sheet .group button.on { font-weight: 700; }
  .actions-sheet .group button .check { color: var(--blue); }
  .actions-sheet .group button[data-t="hot"] { color: var(--hot); }
  .actions-sheet .group button[data-t="warm"] { color: var(--warm); }
  .actions-sheet .group button[data-t="cold"] { color: var(--cold); }
  .actions-sheet .cancel { font-weight: 700; color: var(--blue); }
  .toast {
    position: fixed; left: 50%; bottom: calc(70px + var(--safe-bottom)); transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .install-tip {
    margin: 10px 12px 0; padding: 12px 14px; border-radius: 12px; background: var(--surface); font-size: 13px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .install-tip p { margin: 0; flex: 1; }
  .install-tip button { color: var(--muted); font-size: 18px; line-height: 1; }
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="logo">Leads</div>
  <div class="actions">
    <button class="icon-btn" id="topAdd" aria-label="Add lead">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
    </button>
  </div>
</header>

<main>
  <!-- Home -->
  <section class="view active" id="view-home">
    <div class="stories" id="stories"></div>
    <div id="installTip"></div>
    <div id="feed"></div>
  </section>

  <!-- Search -->
  <section class="view" id="view-search">
    <div class="search-wrap">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search leads" autocomplete="off" autocorrect="off" spellcheck="false">
      </label>
    </div>
    <div id="results"></div>
  </section>

  <!-- Profile -->
  <section class="view" id="view-profile">
    <div class="profile">
      <div class="profile-top">
        <div class="pic"><img src="icons/icon-192.png" alt=""></div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="bio"><b>My video leads</b><span id="bioLine">Tap a lead to edit it.</span></div>
      <div class="btn-row">
        <button class="btn-gray" id="exportBtn">Back up</button>
        <button class="btn-gray" id="importBtn">Restore</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>
    <div class="grid-tabs"><div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></div></div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-tab="home" class="active" aria-label="Home">
    <svg class="outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <svg class="fill" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
  </button>
  <button data-tab="search" aria-label="Search">
    <svg class="outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <svg class="fill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  </button>
  <button data-action="add" aria-label="Add lead">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
  </button>
  <button data-tab="hot" aria-label="Hot leads">
    <svg class="outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 22c4 0 7-2.8 7-7 0-4.5-3.5-7-4.5-11-2 1.5-3.5 4-3.5 6.5-1-1-1.5-2-1.5-3.5C7 9 5 11.6 5 15c0 4.2 3 7 7 7z"/></svg>
    <svg class="fill" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c4 0 7-2.8 7-7 0-4.5-3.5-7-4.5-11-2 1.5-3.5 4-3.5 6.5-1-1-1.5-2-1.5-3.5C7 9 5 11.6 5 15c0 4.2 3 7 7 7z"/></svg>
  </button>
  <button data-tab="profile" aria-label="Profile">
    <span class="me"><img src="icons/icon-192.png" alt=""></span>
  </button>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grabber"></div>
  <div class="sheet-head">
    <button class="left" id="cancelBtn">Cancel</button>
    <h3 id="sheetTitle">New lead</h3>
    <button class="right" id="saveBtn">Save</button>
  </div>
  <form class="sheet-body" id="form" autocomplete="off">
    <div class="photo-pick">
      <button type="button" class="avatar" id="photoPreview" aria-label="Choose profile picture"></button>
      <div class="links">
        <button type="button" id="photoBtn">Add picture</button>
        <button type="button" class="remove" id="photoRemove" hidden>Remove</button>
      </div>
      <input type="file" id="photoFile" accept="image/*" hidden>
    </div>
    <div class="temp-pick" id="tempPick">
      <button type="button" data-t="hot"><span class="e">🔥</span>Hot</button>
      <button type="button" data-t="warm"><span class="e">☀️</span>Warm</button>
      <button type="button" data-t="cold"><span class="e">❄️</span>Cold</button>
    </div>
    <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" placeholder="Client or company" required autocapitalize="words"></div>
    <div class="field"><label for="f-project">Project</label><input id="f-project" name="project" placeholder="Wedding film, music video…" autocapitalize="sentences"></div>
    <div class="chips" id="projectChips"></div>
    <div class="field"><label for="f-budget">Budget</label><input id="f-budget" name="budget" placeholder="$10,000" inputmode="decimal"></div>
    <div class="field"><label for="f-date">Shoot date</label><input id="f-date" name="date" type="date"></div>
    <div class="field"><label for="f-phone">Phone</label><input id="f-phone" name="phone" type="tel" placeholder="(555) 555-5555"></div>
    <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" placeholder="name@email.com" autocapitalize="off"></div>
    <div class="field"><label for="f-ig">Instagram</label><input id="f-ig" name="ig" placeholder="@handle" autocapitalize="off"></div>
    <div class="field top"><label for="f-notes">Notes</label><textarea id="f-notes" name="notes" placeholder="What they want, how they found you, next step…"></textarea></div>
    <button type="button" class="danger" id="deleteBtn" hidden>Delete lead</button>
  </form>
</div>

<div class="actions-sheet" id="tempSheet" role="dialog" aria-modal="true">
  <div class="group">
    <div class="title" id="tempSheetTitle"></div>
    <button data-pick="hot" data-t="hot">🔥 Hot</button>
    <button data-pick="warm" data-t="warm">☀️ Warm</button>
    <button data-pick="cold" data-t="cold">❄️ Cold</button>
  </div>
  <div class="group"><button class="cancel" id="tempCancel">Cancel</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'leads.v1';
  const TEMPS = {
    hot:  { label: 'Hot',  emoji: '🔥' },
    warm: { label: 'Warm', emoji: '☀️' },
    cold: { label: 'Cold', emoji: '❄️' },
  };
  const PROJECT_TYPES = ['Wedding', 'Music video', 'Commercial', 'Real estate', 'Event', 'Brand content', 'Social reels', 'Documentary'];

  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- Storage ----------
  let leads = load();
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(leads)); }
    catch { toast('Could not save — storage is full or blocked'); }
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // ---------- State ----------
  let filter = 'all';
  let tab = 'home';
  let editingId = null;
  let formTemp = 'warm';
  let formPhoto = null;

  // ---------- Helpers ----------
  const initials = name => (name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  function ago(ts) {
    const s = Math.max(1, Math.round((Date.now() - ts) / 1000));
    if (s < 60) return 'Just now';
    const m = Math.round(s / 60); if (m < 60) return m + (m === 1 ? ' minute ago' : ' minutes ago');
    const h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    const d = Math.round(h / 24); if (d < 7) return d + (d === 1 ? ' day ago' : ' days ago');
    return new Date(ts).toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: d > 300 ? 'numeric' : undefined });
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  // "$10000" / "10k" / "2500.5" / "5k-10k" -> "$10,000" / "$10,000" / "$2,500.50" / "$5,000-$10,000"
  function fmtBudget(b) {
    b = (b || '').trim();
    if (!b) return '';
    return b.replace(/\$?\s*(\d[\d,]*(?:\.\d+)?)\s*([km])?\b/gi, (_, num, unit) => {
      let n = parseFloat(num.replace(/,/g, ''));
      if (unit) n *= unit.toLowerCase() === 'k' ? 1e3 : 1e6;
      const cents = n % 1 !== 0;
      return '$' + n.toLocaleString('en-US', { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: 2 });
    });
  }
  const sorted = list => [...list].sort((a, b) => b.updatedAt - a.updatedAt);
  const counts = () => leads.reduce((c, l) => (c[l.temp]++, c), { hot: 0, warm: 0, cold: 0 });

  // ---------- Rendering ----------
  function renderStories() {
    const c = counts();
    const items = [
      { f: 'all', label: 'All leads', emoji: '🎬', n: leads.length },
      ...Object.entries(TEMPS).map(([f, t]) => ({ f, label: t.label, emoji: t.emoji, n: c[f] })),
    ];
    $('#stories').innerHTML =
      `<button class="story new" data-action="add"><div class="ring"><div>🎥<span class="plus">+</span></div></div><span class="label">New lead</span></button>` +
      items.map(i => `
        <button class="story ${filter === i.f ? 'selected' : ''}" data-f="${i.f}">
          <div class="ring"><div>${i.emoji}${i.n ? `<span class="count">${i.n}</span>` : ''}</div></div>
          <span class="label">${i.label}</span>
        </button>`).join('');
  }

  function avatarHTML(l, cls = '') {
    const inner = l.photo ? `<img src="${esc(l.photo)}" alt="">` : `<span>${esc(initials(l.name))}</span>`;
    return `<div class="avatar ${cls}">${inner}</div>`;
  }

  function leadHTML(l) {
    const money = fmtBudget(l.budget);
    const sub = [l.project && esc(l.project), money && `<span class="money">${esc(money)}</span>`].filter(Boolean).join(' · ')
      || esc(l.ig || l.email || l.phone || '');
    return `
      <div class="lead t-${l.temp}" data-id="${l.id}">
        <button class="open" data-edit>
          ${avatarHTML(l)}
          <div class="who"><div class="name">${esc(l.name)}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
        </button>
        <button class="temp-btn ${l.temp}" data-temp aria-label="Change tag, currently ${TEMPS[l.temp].label}">${TEMPS[l.temp].emoji} ${TEMPS[l.temp].label}</button>
      </div>`;
  }

  function emptyHTML(f) {
    if (f === 'all' || !leads.length) {
      return `<div class="empty">
        <div class="big-ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3z"/></svg></div>
        <h2>Add your first lead</h2>
        <p>Everyone who reaches out about a video project goes here. Tag them Hot, Warm or Cold.</p>
        <button class="link-btn" data-action="add">Add a lead</button></div>`;
    }
    return `<div class="empty"><h2>No ${TEMPS[f].label.toLowerCase()} leads</h2><p>Nothing tagged ${TEMPS[f].emoji} ${TEMPS[f].label} right now.</p><button class="link-btn" data-f="all">Show all leads</button></div>`;
  }

  function renderFeed() {
    const f = tab === 'hot' ? 'hot' : filter;
    const list = sorted(f === 'all' ? leads : leads.filter(l => l.temp === f));
    const title = f === 'all' ? 'All leads' : `${TEMPS[f].emoji} ${TEMPS[f].label} leads`;
    $('#feed').innerHTML = list.length
      ? `<div class="list-head"><h2>${title}</h2><span>${list.length}</span></div>` + list.map(leadHTML).join('')
      : emptyHTML(f);
  }

  function renderSearch() {
    const q = $('#q').value.trim().toLowerCase();
    const list = sorted(leads).filter(l => !q ||
      [l.name, l.project, l.notes, l.ig, l.email, l.phone, l.budget, fmtBudget(l.budget), TEMPS[l.temp].label].join(' ').toLowerCase().includes(q));
    $('#results').innerHTML = list.length ? list.map(leadHTML).join('')
      : `<div class="empty"><p>${leads.length ? 'No leads match “' + esc(q) + '”.' : 'No leads yet.'}</p></div>`;
  }

  function renderProfile() {
    const c = counts();
    $('#stats').innerHTML = Object.entries(TEMPS).map(([k, v]) => `<div><b>${c[k]}</b><span>${v.emoji} ${v.label}</span></div>`).join('');
    $('#bioLine').textContent = leads.length ? `${leads.length} lead${leads.length === 1 ? '' : 's'} · tap a lead to edit it` : 'No leads yet — tap + to add one.';
    const order = { hot: 0, warm: 1, cold: 2 };
    const list = [...leads].sort((a, b) => order[a.temp] - order[b.temp] || b.updatedAt - a.updatedAt);
    $('#grid').innerHTML = list.map(l => `
      <button class="tile ${l.temp} ${l.photo ? 'has-photo' : ''}" data-id="${l.id}" data-edit
        ${l.photo ? `style="background-image: linear-gradient(transparent 45%, rgba(0,0,0,.65)), url(&quot;${esc(l.photo)}&quot;)"` : ''}>
        <span class="e">${TEMPS[l.temp].emoji}</span>
        <b>${esc(l.name)}</b><span>${esc(fmtBudget(l.budget) || l.project || '')}</span>
      </button>`).join('');
  }

  function render() {
    renderStories();
    renderFeed();
    if (tab === 'search') renderSearch();
    if (tab === 'profile') renderProfile();
  }

  // ---------- Install tip (Safari, not yet on home screen) ----------
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  function renderInstallTip() {
    let dismissed = false;
    try { dismissed = localStorage.getItem('tip.dismissed') === '1'; } catch {}
    if (standalone || !isIOS || dismissed) return;
    $('#installTip').innerHTML = `<div class="install-tip"><p>Add this to your Home Screen: tap <b>Share</b> <span aria-hidden="true">⬆︎</span> then <b>Add to Home Screen</b>. Add leads after installing, since the Home Screen app keeps its own storage.</p><button id="tipClose" aria-label="Dismiss">✕</button></div>`;
    $('#tipClose').onclick = () => { try { localStorage.setItem('tip.dismissed', '1'); } catch {} $('#installTip').innerHTML = ''; };
  }

  // ---------- Tabs ----------
  function setTab(next) {
    tab = next;
    $$('#tabbar [data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    const view = tab === 'hot' ? 'home' : tab;
    $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
    $('#stories').style.display = tab === 'hot' ? 'none' : '';
    $('.logo').textContent = tab === 'hot' ? 'Hot leads' : tab === 'profile' ? 'Profile' : 'Leads';
    render();
    window.scrollTo(0, 0);
    if (tab === 'search') setTimeout(() => $('#q').focus(), 50);
  }

  // ---------- Sheet ----------
  const form = $('#form');
  function setFormTemp(t) {
    formTemp = t;
    $$('#tempPick button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    renderPhotoPreview();
  }
  function renderChips() {
    const cur = form.project.value.trim().toLowerCase();
    $('#projectChips').innerHTML = PROJECT_TYPES.map(p => `<button type="button" class="chip ${cur === p.toLowerCase() ? 'on' : ''}">${p}</button>`).join('');
  }
  function openSheet(id = null) {
    editingId = id;
    const l = id ? leads.find(x => x.id === id) : null;
    form.reset();
    for (const k of ['name', 'project', 'budget', 'date', 'phone', 'email', 'ig', 'notes']) form[k].value = l?.[k] || '';
    form.budget.value = fmtBudget(form.budget.value);
    formPhoto = l?.photo || null;
    setFormTemp(l?.temp || (filter !== 'all' ? filter : tab === 'hot' ? 'hot' : 'warm'));
    $('#sheetTitle').textContent = l ? 'Edit lead' : 'New lead';
    $('#saveBtn').textContent = l ? 'Done' : 'Save';
    $('#deleteBtn').hidden = !l;
    renderChips();
    updateSaveState();
    $('#sheet').classList.add('open');
    $('#backdrop').classList.add('open');
    $('#sheet .sheet-body').scrollTop = 0;
    if (!l) setTimeout(() => form.name.focus(), 320);
  }
  function closeSheet() {
    document.activeElement?.blur();
    $('#sheet').classList.remove('open');
    $('#backdrop').classList.remove('open');
    editingId = null;
  }
  function updateSaveState() { $('#saveBtn').disabled = !form.name.value.trim(); }

  function submit() {
    const name = form.name.value.trim();
    if (!name) { form.name.focus(); return; }
    let ig = form.ig.value.trim();
    if (ig && !ig.startsWith('@') && !ig.includes('/')) ig = '@' + ig;
    const data = {
      name, ig,
      project: form.project.value.trim(),
      budget: fmtBudget(form.budget.value),
      date: form.date.value,
      phone: form.phone.value.trim(),
      email: form.email.value.trim(),
      notes: form.notes.value.trim(),
      temp: formTemp,
      photo: formPhoto || undefined,
    };
    const now = Date.now();
    const isNew = !editingId;
    if (editingId) {
      const l = leads.find(x => x.id === editingId);
      Object.assign(l, data, { updatedAt: now });
      toast('Lead updated');
    } else {
      const id = (crypto.randomUUID ? crypto.randomUUID() : now.toString(36) + Math.random().toString(36).slice(2));
      leads.push({ id, ...data, createdAt: now, updatedAt: now });
      toast(`${TEMPS[formTemp].emoji} ${name} added`);
      if (tab !== 'home' && tab !== 'hot') setTab('home');
      if (filter !== 'all' && filter !== formTemp) filter = 'all';
    }
    save();
    closeSheet();
    render();
    if (isNew) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setTemp(id, t) {
    const l = leads.find(x => x.id === id);
    if (!l || l.temp === t) return;
    l.temp = t; l.updatedAt = Date.now();
    save();
    render();
    toast(`${TEMPS[t].emoji} ${l.name} is now ${TEMPS[t].label}`);
    if (navigator.vibrate) navigator.vibrate(10);
  }

  // Hot / Warm / Cold action sheet
  let tempSheetId = null;
  function openTempSheet(id) {
    const l = leads.find(x => x.id === id);
    if (!l) return;
    tempSheetId = id;
    $('#tempSheetTitle').textContent = `Tag ${l.name} as…`;
    $$('#tempSheet [data-pick]').forEach(b => {
      const on = b.dataset.pick === l.temp;
      b.classList.toggle('on', on);
      b.innerHTML = `${TEMPS[b.dataset.pick].emoji} ${TEMPS[b.dataset.pick].label}${on ? ' <span class="check">✓</span>' : ''}`;
    });
    $('#tempSheet').classList.add('open');
    $('#backdrop').classList.add('open');
  }
  function closeTempSheet() {
    tempSheetId = null;
    $('#tempSheet').classList.remove('open');
    if (!$('#sheet').classList.contains('open')) $('#backdrop').classList.remove('open');
  }

  // ---------- Profile pictures ----------
  // Center-crop to a square and shrink so hundreds of leads still fit in on-device storage.
  async function loadPhoto(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const size = Math.min(320, side);
      const c = document.createElement('canvas');
      c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
      return c.toDataURL('image/jpeg', 0.82);
    } finally { URL.revokeObjectURL(url); }
  }
  function renderPhotoPreview() {
    const preview = $('#photoPreview');
    preview.className = `avatar t-${formTemp}`;
    preview.innerHTML = formPhoto ? `<img src="${formPhoto}" alt="">` : `<span>${esc(initials(form.name.value))}</span>`;
    $('#photoBtn').textContent = formPhoto ? 'Change picture' : 'Add picture';
    $('#photoRemove').hidden = !formPhoto;
  }

  // ---------- Toast ----------
  let toastTimer;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  // ---------- Backup ----------
  async function exportLeads() {
    const json = JSON.stringify({ app: 'leads', version: 1, exportedAt: new Date().toISOString(), leads }, null, 2);
    const fileName = `leads-backup-${new Date().toISOString().slice(0, 10)}.json`;
    const file = new File([json], fileName, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Leads backup' }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = fileName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  async function importLeads(file) {
    try {
      const data = JSON.parse(await file.text());
      const incoming = Array.isArray(data) ? data : data.leads;
      if (!Array.isArray(incoming)) throw new Error();
      const byId = new Map(leads.map(l => [l.id, l]));
      let added = 0;
      for (const l of incoming) {
        if (!l || !l.id || !l.name || !TEMPS[l.temp]) continue;
        if (l.photo && !/^data:image\/[a-z+]+;base64,[\w+/=]+$/i.test(l.photo)) delete l.photo;
        const cur = byId.get(l.id);
        if (!cur) added++;
        if (!cur || (l.updatedAt || 0) > (cur.updatedAt || 0)) byId.set(l.id, l);
      }
      leads = [...byId.values()];
      save(); render();
      toast(`Restored · ${added} new lead${added === 1 ? '' : 's'}`);
    } catch { toast('That file isn’t a leads backup'); }
  }

  // ---------- Events ----------
  document.addEventListener('click', e => {
    const t = e.target;
    const add = t.closest('[data-action="add"]');
    if (add) { openSheet(); return; }
    const tabBtn = t.closest('#tabbar [data-tab]');
    if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
    const story = t.closest('[data-f]');
    if (story) { filter = story.dataset.f; if (tab !== 'home') setTab('home'); else render(); return; }
    const tempBtn = t.closest('[data-temp]');
    if (tempBtn) { openTempSheet(tempBtn.closest('[data-id]').dataset.id); return; }
    const pick = t.closest('[data-pick]');
    if (pick) { const id = tempSheetId; closeTempSheet(); setTemp(id, pick.dataset.pick); return; }
    const edit = t.closest('[data-edit]');
    if (edit) { openSheet(edit.closest('[data-id]').dataset.id); return; }
  });

  $('#topAdd').onclick = () => openSheet();
  $('#cancelBtn').onclick = closeSheet;
  $('#backdrop').onclick = () => { if (tempSheetId) closeTempSheet(); else closeSheet(); };
  $('#tempCancel').onclick = closeTempSheet;
  $('#saveBtn').onclick = submit;
  form.addEventListener('submit', e => { e.preventDefault(); submit(); });
  form.addEventListener('input', e => {
    updateSaveState();
    if (e.target === form.project) renderChips();
    if (e.target === form.name && !formPhoto) renderPhotoPreview();
  });
  form.budget.addEventListener('blur', () => { form.budget.value = fmtBudget(form.budget.value); });
  $('#photoPreview').onclick = $('#photoBtn').onclick = () => $('#photoFile').click();
  $('#photoRemove').onclick = () => { formPhoto = null; renderPhotoPreview(); };
  $('#photoFile').onchange = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try { formPhoto = await loadPhoto(f); renderPhotoPreview(); }
    catch { toast('Couldn’t open that picture'); }
  };
  $('#tempPick').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setFormTemp(b.dataset.t); });
  $('#projectChips').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    form.project.value = c.classList.contains('on') ? '' : c.textContent;
    renderChips();
  });
  $('#deleteBtn').onclick = () => {
    const l = leads.find(x => x.id === editingId);
    if (!l || !confirm(`Delete ${l.name}? This can’t be undone.`)) return;
    leads = leads.filter(x => x.id !== editingId);
    save(); closeSheet(); render(); toast('Lead deleted');
  };
  $('#q').addEventListener('input', renderSearch);
  $('#exportBtn').onclick = exportLeads;
  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').onchange = e => { const f = e.target.files[0]; if (f) importLeads(f); e.target.value = ''; };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeTempSheet(); closeSheet(); } });
  window.addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', window.scrollY > 4), { passive: true });
  // Refresh "x minutes ago" labels when the app comes back to the foreground
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#sheet').classList.contains('open')) render(); });

  renderInstallTip();
  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
