<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Backyard</title>
<meta name="description" content="Backyard ultra tracker: run a loop every hour, tap Done, rest until the next one.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Backyard">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root {
    color-scheme: light;
    --bg: #f2f2f7;
    --card: #ffffff;
    --card-2: #e9e9ee;
    --text: #0c0c0e;
    --muted: #6e6e73;
    --line: #dcdce1;
    --grid: #e6e6ea;
    --accent: #fc5200;
    --accent-ink: #ffffff;
    --accent-soft: rgba(252, 82, 0, .12);
    --go: #16a34a;
    --warn: #c98500;
    --danger: #e5484d;
    --run: #eb6834;
    --rest: #2a78d6;
    --sheet: #ffffff;
    --backdrop: rgba(0,0,0,.4);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #000000;
      --card: #1c1c1e;
      --card-2: #2c2c2e;
      --text: #f5f5f7;
      --muted: #98989f;
      --line: #2c2c2e;
      --grid: #2a2a2d;
      --accent: #ff6a1a;
      --accent-soft: rgba(255, 106, 26, .16);
      --go: #30d158;
      --warn: #ffb020;
      --danger: #ff6369;
      --run: #d95926;
      --rest: #3987e5;
      --sheet: #1c1c1e;
      --backdrop: rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  /* Layout */
  .screen {
    min-height: 100%;
    padding: calc(var(--safe-top) + 12px) 16px calc(var(--safe-bottom) + 96px);
    max-width: 560px;
    margin: 0 auto;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; margin-bottom: 8px; }
  .topbar h1 { font-size: 30px; line-height: 1.1; margin: 0; font-weight: 800; letter-spacing: -.02em; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--card); color: var(--accent); flex: none; }
  .icon-btn svg { width: 22px; height: 22px; }

  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 17px; margin: 0 0 12px; font-weight: 700; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 20px 4px 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* Tab bar */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: grid; grid-template-columns: repeat(3, 1fr);
    padding: 6px 8px calc(var(--safe-bottom) + 6px);
    background: color-mix(in srgb, var(--card) 88%, transparent);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--line);
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: var(--muted); font-size: 11px; font-weight: 600; }
  .tab svg { width: 26px; height: 26px; }
  .tab[aria-selected="true"] { color: var(--accent); }
  .tab .live { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); position: absolute; margin-left: 22px; margin-top: 2px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 14px; font-weight: 700; background: var(--card-2); }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.danger { color: var(--danger); }
  .btn.block { width: 100%; }
  .btn.big { height: 58px; font-size: 18px; border-radius: 16px; }
  .btn:active { opacity: .8; }
  .row-btns { display: flex; gap: 10px; }
  .row-btns .btn { flex: 1; }

  /* Segmented */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card-2); border-radius: 10px; padding: 2px; gap: 2px; }
  .seg button { height: 34px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  @media (prefers-color-scheme: dark) { .seg button.on { background: #636366; } }

  /* Forms */
  .field { display: block; margin-bottom: 16px; }
  .field > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .input { width: 100%; height: 44px; border-radius: 10px; border: 0; background: var(--card-2); padding: 0 12px; font-size: 16px; outline: none; }
  textarea.input { height: 96px; padding: 10px 12px; resize: none; }
  .input:focus { box-shadow: 0 0 0 2px var(--accent); }
  .field .input + .input, .field .seg + .input { margin-top: 8px; }

  /* Setup hero */
  .hero { padding: 6px 4px 14px; }
  .eyebrow { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
  .hero h1 { font-size: 34px; line-height: 1.05; margin: 4px 0 8px; font-weight: 800; letter-spacing: -.02em; }
  .hero p { margin: 0; color: var(--muted); }
  .tip { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--muted); padding: 0 4px; margin-top: 12px; }
  .tip svg { flex: none; width: 18px; height: 18px; color: var(--accent); margin-top: 1px; }

  /* Active race */
  .race-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .race-name { font-weight: 700; font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 14px; font-size: 13px; font-weight: 700; background: var(--card); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.running { color: var(--go); }
  .pill.waiting { color: var(--rest); }
  .loop-title { text-align: center; margin: 8px 0 0; font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .loop-title b { color: var(--text); font-size: 15px; }
  .ring-wrap { position: relative; width: min(62vw, 250px, 34vh); aspect-ratio: 1; margin: 10px auto 14px; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-track { stroke: var(--card-2); }
  .ring-fill { stroke: var(--accent); transition: stroke-dashoffset .3s linear, stroke .3s; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .ring-big { font-size: clamp(40px, 13vw, 56px); font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .ring-label { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 6px; }
  .ring-sub { font-size: 15px; font-weight: 700; margin-top: 10px; }
  .callout { text-align: center; font-weight: 800; font-size: 17px; margin: -4px 0 10px; min-height: 22px; }
  .callout.warn { color: var(--warn); }
  .callout.danger { color: var(--danger); }
  .callout.go { color: var(--go); }

  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  .tiles.three { grid-template-columns: repeat(3, 1fr); }
  .tile { background: var(--card); border-radius: 14px; padding: 12px 14px; min-width: 0; }
  .tile .label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .tile .value { font-size: 24px; font-weight: 750; letter-spacing: -.02em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .value small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
  .tiles.three .tile .value { font-size: 20px; }

  .gps { display: flex; align-items: center; gap: 6px; justify-content: center; font-size: 12px; color: var(--muted); margin: 10px 0 12px; text-align: center; }
  .gps .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .gps.good .dot { background: var(--go); }
  .gps.bad .dot { background: var(--danger); }

  /* Hold-to-finish button */
  .hold {
    position: relative; overflow: hidden; width: 100%; height: 76px; border-radius: 20px;
    background: var(--go); color: #fff; font-size: 22px; font-weight: 800; letter-spacing: .02em;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .hold .fill { position: absolute; inset: 0; background: rgba(255,255,255,.28); transform-origin: left; transform: scaleX(0); }
  .hold.pressing .fill { transform: scaleX(1); transition: transform .7s linear; }
  .hold span { position: relative; display: block; }
  .hold small { position: relative; display: block; font-size: 12px; font-weight: 600; opacity: .85; letter-spacing: 0; margin-top: 2px; }

  .route-box { background: var(--card); border-radius: 16px; padding: 8px; margin-bottom: 12px; }
  .route-box svg { display: block; width: 100%; height: 160px; }
  .route-empty { height: 160px; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 0 20px; }

  .loop-list { list-style: none; margin: 0; padding: 0; }
  .loop-list li { display: grid; grid-template-columns: 54px 1fr auto; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .loop-list li:first-child { border-top: 0; }
  .loop-list .n { font-weight: 800; }
  .loop-list .t { font-weight: 700; }
  .loop-list .r { color: var(--muted); font-size: 13px; text-align: right; }

  /* Results */
  .race-card { display: block; width: 100%; text-align: left; background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .race-card .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .race-card .name { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .race-card .date { font-size: 13px; color: var(--muted); flex: none; }
  .race-card .stats { display: flex; gap: 18px; margin-top: 10px; }
  .race-card .stat b { display: block; font-size: 20px; font-weight: 750; letter-spacing: -.02em; }
  .race-card .stat span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .race-card .spark { margin-top: 10px; height: 26px; display: flex; align-items: flex-end; gap: 2px; }
  .race-card .spark i { flex: 1; max-width: 10px; background: var(--run); border-radius: 2px 2px 0 0; min-height: 2px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: var(--card-2); color: var(--muted); }
  .badge.finished { color: var(--go); }
  .badge.cutoff, .badge.dnf { color: var(--danger); }

  .empty { text-align: center; padding: 48px 24px; color: var(--muted); }
  .empty svg { width: 52px; height: 52px; color: var(--accent); margin-bottom: 10px; }
  .empty h3 { color: var(--text); margin: 0 0 6px; font-size: 18px; }
  .empty p { margin: 0 0 16px; }

  .hero-num { font-size: 56px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .hero-num small { font-size: 18px; font-weight: 700; color: var(--muted); letter-spacing: 0; margin-left: 4px; }

  /* Charts */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart .axis { fill: var(--muted); font-size: 11px; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; }
  .chart .baseline { stroke: var(--line); stroke-width: 1; }
  .chart .hit { fill: transparent; }
  .chart .mark-label { fill: var(--text); font-size: 11px; font-weight: 700; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); font-weight: 600; margin: -4px 0 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .tooltip {
    position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, calc(-100% - 10px));
    background: var(--text); color: var(--bg); font-size: 12px; font-weight: 600; line-height: 1.3;
    padding: 6px 9px; border-radius: 8px; white-space: nowrap;
  }
  .chart-sub { font-size: 13px; color: var(--muted); margin: -8px 0 12px; }
  .table-toggle { font-size: 13px; font-weight: 600; color: var(--accent); margin-top: 10px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  table.data th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  table.data td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
  table.data td:not(:first-child), table.data th:not(:first-child) { text-align: right; }

  .records { list-style: none; margin: 0; padding: 0; }
  .records li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .records li:first-child { border-top: 0; }
  .records b { font-weight: 700; }

  /* Detail page */
  .page { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; animation: slide-in .25s ease; }
  @keyframes slide-in { from { transform: translateX(30%); opacity: .4; } to { transform: none; opacity: 1; } }
  .back { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-weight: 600; font-size: 17px; height: 44px; }
  .back svg { width: 22px; height: 22px; }

  /* Friends */
  .me-card { display: flex; gap: 14px; align-items: center; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #fff; flex: none; background: linear-gradient(135deg, #ff8a3d, #fc5200); }
  .avatar.sm { width: 40px; height: 40px; font-size: 15px; }
  .me-card .input { height: 40px; font-weight: 700; }
  .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 700; letter-spacing: .08em; }
  .board { list-style: none; margin: 0; padding: 0; }
  .board li { display: grid; grid-template-columns: 26px 40px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .board li:first-child { border-top: 0; }
  .board li.me .who b::after { content: " (you)"; color: var(--muted); font-weight: 600; }
  .board .rank { font-weight: 800; color: var(--muted); text-align: center; }
  .board .rank.top { color: var(--accent); }
  .board .who { min-width: 0; text-align: left; }
  .board .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board .who span { font-size: 12px; color: var(--muted); }
  .board .score { font-weight: 800; font-size: 17px; text-align: right; }
  .board .score small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
  .board button.who { width: 100%; }
  .board button.who:disabled { opacity: 1; color: inherit; cursor: default; }

  /* Sheet */
  .backdrop { position: fixed; inset: 0; z-index: 40; background: var(--backdrop); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; } }
  .sheet {
    width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--sheet);
    border-radius: 20px 20px 0 0; padding: 10px 16px calc(var(--safe-bottom) + 20px);
    animation: up .25s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes up { from { transform: translateY(40%); } }
  .sheet .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .sheet h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
  .sheet p { margin: 0 0 14px; color: var(--muted); }
  .sheet .btn + .btn { margin-top: 10px; }
  .sheet .tiles .tile { background: var(--card-2); }
  .sheet-center { text-align: center; }
  .trophy { width: 64px; height: 64px; color: var(--accent); margin: 6px auto 8px; display: block; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 84px); transform: translateX(-50%); z-index: 60; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); text-align: center; animation: fade .2s ease; }
</style>
</head>
<body>

<main id="tab-race" class="screen"></main>
<main id="tab-results" class="screen" hidden></main>
<main id="tab-friends" class="screen" hidden></main>

<nav class="tabbar" role="tablist">
  <button class="tab" role="tab" data-tab="race" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="14.5" cy="4" r="2.2"/><path d="M10.6 7.2c.5-.3 1.1-.4 1.7-.3l2.3.5c.7.2 1.2.6 1.5 1.2l1.1 2.2 2.2.7a1 1 0 1 1-.6 1.9l-2.6-.8a1.2 1.2 0 0 1-.7-.6l-.6-1.2-1 3.4 2.4 2.1c.3.2.4.6.4.9l.3 4.4a1.1 1.1 0 1 1-2.2.1l-.3-3.9-2.6-2.2-1 3.2c-.1.3-.3.6-.6.7l-3.6 2a1.1 1.1 0 0 1-1.1-1.9l3.2-1.8 2.3-7.4-1.4.8-1 2.6a1.1 1.1 0 1 1-2-.8l1.1-2.9c.1-.3.3-.5.6-.6z"/></svg>
    Race<i class="live" id="live-dot" hidden></i>
  </button>
  <button class="tab" role="tab" data-tab="results" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4" height="9" rx="1.2"/><rect x="10" y="7" width="4" height="14" rx="1.2"/><rect x="17" y="3" width="4" height="18" rx="1.2"/></svg>
    Results
  </button>
  <button class="tab" role="tab" data-tab="friends" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="8" r="3.6"/><path d="M2.5 19.2c0-3.3 2.9-5.7 6.5-5.7s6.5 2.4 6.5 5.7c0 .6-.4 1-1 1h-11a1 1 0 0 1-1-1z"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 13.6c3 0 5.2 2 5.2 4.8 0 .5-.4.9-.9.9h-3.6c.1-.3.1-.7.1-1 0-1.8-.7-3.4-1.9-4.6.4-.1.7-.1 1.1-.1z"/></svg>
    Friends
  </button>
</nav>

<script>
'use strict';

/* ---------- Storage ---------- */
const KEY = 'backyard-v1';
const M_PER_MI = 1609.344;
const OFFICIAL_MI = 4.1667; // 100 miles in 24 hours

function uid() { return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36)); }
function defaults() {
  return { profile: { id: uid(), name: '' }, races: [], active: null, friends: [], settings: { loopMiles: OFFICIAL_MI, intervalMin: 60, sound: true } };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s === 'object') {
      const d = defaults();
      return { ...d, ...s, profile: { ...d.profile, ...s.profile }, settings: { ...d.settings, ...s.settings } };
    }
  } catch (e) {}
  return defaults();
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Phone storage is full. Back up and delete old races.'); }
}

/* ---------- Helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function dur(ms, { up = false, hours = false } = {}) {
  let s = ms / 1000;
  s = Math.max(0, up ? Math.ceil(s) : Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const p = n => String(n).padStart(2, '0');
  return (h > 0 || hours) ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
}
function pace(msPerMile) {
  if (!isFinite(msPerMile) || msPerMile <= 0) return '–';
  return dur(msPerMile);
}
function mi(miles, digits = 1) {
  if (!isFinite(miles)) return '–';
  return (Math.round(miles * 10 ** digits) / 10 ** digits).toLocaleString(undefined, { maximumFractionDigits: digits, minimumFractionDigits: miles > 0 && miles < 10 && digits ? digits : 0 });
}
function distLabel(miles) { return Math.abs(miles - OFFICIAL_MI) < 0.001 ? '4.167' : String(+miles.toFixed(2)); }
function dateLabel(ts, opts = { month: 'short', day: 'numeric', year: 'numeric' }) { return new Date(ts).toLocaleDateString(undefined, opts); }
function timeLabel(ts) { return new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }
function initials(name) { return (name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?'; }
function friendCode(id) { return id.replace(/[^a-z0-9]/gi, '').slice(0, 6).toUpperCase(); }

let toastTimer;
function toast(msg) {
  $('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}

/* ---------- Race math ---------- */
const intervalMs = r => r.intervalMin * 60000;
const loopStart = (r, n) => r.start + (n - 1) * intervalMs(r);
const loopDeadline = (r, n) => loopStart(r, n + 1);
const currentLoop = r => r.loops.length + 1;
const phaseOf = (r, now) => now < loopStart(r, currentLoop(r)) ? 'waiting' : 'running';
const loopMs = l => l.finish - l.start;
const officialMiles = r => r.loops.length * r.loopMiles;

function raceStats(r) {
  const times = r.loops.map(loopMs);
  return {
    loops: r.loops.length,
    miles: officialMiles(r),
    gpsMiles: r.loops.reduce((a, l) => a + (l.meters || 0), 0) / M_PER_MI,
    elapsed: (r.end || Date.now()) - r.start,
    avg: times.length ? times.reduce((a, b) => a + b, 0) / times.length : null,
    fastest: times.length ? Math.min(...times) : null,
    slowest: times.length ? Math.max(...times) : null,
  };
}
function career(races = S.races) {
  const all = races.flatMap(r => r.loops.map(loopMs));
  const best = races.reduce((b, r) => (!b || r.loops.length > b.loops.length ? r : b), null);
  return {
    races: races.length,
    best: best ? best.loops.length : 0,
    bestRace: best,
    loops: races.reduce((a, r) => a + r.loops.length, 0),
    miles: races.reduce((a, r) => a + officialMiles(r), 0),
    fastest: all.length ? Math.min(...all) : null,
    avg: all.length ? all.reduce((a, b) => a + b, 0) / all.length : null,
    last: races.length ? Math.max(...races.map(r => r.start)) : null,
  };
}
const END_LABEL = { finished: 'Finished', dnf: 'Stopped mid-loop', cutoff: 'Missed cutoff' };

/* ---------- Sound & voice ---------- */
let audioCtx = null;
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // A silent blip unlocks audio on iOS.
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    g.gain.value = 0; o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.01);
  } catch (e) {}
}
function tone(at, freq, len, vol = 0.25, type = 'sine', trill = 0) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  if (trill) {
    const lfo = audioCtx.createOscillator(), lg = audioCtx.createGain();
    lfo.frequency.value = trill; lg.gain.value = freq * 0.06;
    lfo.connect(lg).connect(o.frequency); lfo.start(at); lfo.stop(at + len);
  }
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(vol, at + 0.02);
  g.gain.setValueAtTime(vol, at + len - 0.05);
  g.gain.linearRampToValueAtTime(0, at + len);
  o.connect(g).connect(audioCtx.destination);
  o.start(at); o.stop(at + len + 0.02);
}
function whistle(count) {
  if (!S.settings.sound || !audioCtx) return;
  const t = audioCtx.currentTime + 0.05;
  for (let i = 0; i < count; i++) tone(t + i * 0.6, 2600, 0.42, 0.18, 'sine', 32);
}
function bell() {
  if (!S.settings.sound || !audioCtx) return;
  const t = audioCtx.currentTime + 0.05;
  for (let i = 0; i < 3; i++) { tone(t + i * 0.5, 880, 0.45, 0.25, 'triangle'); tone(t + i * 0.5, 1320, 0.45, 0.12, 'sine'); }
}
function chime() {
  if (!S.settings.sound || !audioCtx) return;
  const t = audioCtx.currentTime + 0.02;
  tone(t, 660, 0.15, 0.2, 'triangle'); tone(t + 0.14, 990, 0.25, 0.2, 'triangle');
}
function say(text) {
  if (!S.settings.sound || !('speechSynthesis' in window)) return;
  try { const u = new SpeechSynthesisUtterance(text); u.rate = 1.02; speechSynthesis.speak(u); } catch (e) {}
}
function buzz(pattern) { try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) {} }

/* Cues fire once each, and only if we're within a few seconds of their moment
   (so reopening the app later doesn't replay old whistles). */
function cuesFor(r, n) {
  const st = loopStart(r, n), dl = loopDeadline(r, n), iv = intervalMs(r);
  const c = [];
  if (iv > 3 * 60000) c.push({ id: `${n}-w3`, at: st - 180000, run: () => { whistle(3); say(`Three minutes until loop ${n}.`); } });
  if (iv > 2 * 60000) c.push({ id: `${n}-w2`, at: st - 120000, run: () => { whistle(2); say('Two minutes.'); } });
  if (iv > 60000) c.push({ id: `${n}-w1`, at: st - 60000, run: () => { whistle(1); say('One minute. Get to the corral.'); } });
  c.push({ id: `${n}-go`, at: st, run: () => { bell(); say(`Loop ${n}. Go!`); buzz([300, 100, 300]); } });
  if (iv > 20 * 60000) c.push({ id: `${n}-t10`, at: dl - 600000, run: () => { chime(); say('Ten minutes left in this loop.'); } });
  if (iv > 10 * 60000) c.push({ id: `${n}-t5`, at: dl - 300000, run: () => { chime(); say('Five minutes left.'); buzz(200); } });
  return c;
}
function runCues(r, now) {
  r.cues = r.cues || [];
  const n = currentLoop(r);
  for (const c of cuesFor(r, n)) {
    if (now >= c.at && !r.cues.includes(c.id)) {
      r.cues.push(c.id);
      if (now - c.at < 5000) c.run();
      save();
    }
  }
}

/* ---------- Screen wake lock ---------- */
let wakeLock = null;
async function keepAwake() {
  if (!S.active || wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) {}
}
function releaseAwake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

/* ---------- GPS ---------- */
let watchId = null;
let gps = { state: 'off', accuracy: null };
let lastTrackSave = 0;

function haversine(a, b) {
  const R = 6371008.8, toR = Math.PI / 180;
  const dLat = (b[0] - a[0]) * toR, dLon = (b[1] - a[1]) * toR;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * toR) * Math.cos(b[0] * toR) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function startGPS() {
  if (watchId !== null) return;
  if (!('geolocation' in navigator)) { gps = { state: 'unavailable', accuracy: null }; return; }
  gps = { state: 'searching', accuracy: null };
  watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
function stopGPS() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  gps = { state: 'off', accuracy: null };
}
function onPosition(p) {
  const r = S.active;
  if (!r || !r.track) return;
  const t = r.track;
  const { latitude, longitude, accuracy } = p.coords;
  gps = { state: accuracy <= 30 ? 'good' : 'weak', accuracy };
  // Wall-clock time of arrival; iOS sometimes hands back a cached fix with an old timestamp.
  const ts = Date.now();
  if (accuracy > 30 || ts < loopStart(r, t.n)) return;
  const pt = [+latitude.toFixed(6), +longitude.toFixed(6)];
  if (t.last) {
    const d = haversine(t.last, pt);
    const dt = (ts - t.lastT) / 1000;
    if (dt <= 0) return;
    if (d / dt > 12) return;          // GPS jump, faster than any runner
    if (d < Math.max(3, accuracy / 3)) return; // standing still / jitter
    t.meters += d;
  }
  t.last = pt; t.lastT = ts;
  t.route.push(pt);
  if (Date.now() - lastTrackSave > 5000) { lastTrackSave = Date.now(); save(); }
}
function onPositionError(err) {
  gps = { state: err.code === 1 ? 'denied' : 'searching', accuracy: null };
  if (err.code === 1) stopGPSWatchOnly();
}
function stopGPSWatchOnly() { if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } }

// Keep stored routes small: one point every ~20 m.
function thinRoute(route) {
  const out = [];
  for (const p of route) {
    if (!out.length || haversine(out[out.length - 1], p) >= 20) out.push(p);
  }
  if (route.length && out[out.length - 1] !== route[route.length - 1]) out.push(route[route.length - 1]);
  return out;
}

/* ---------- Race actions ---------- */
function startRace({ name, loopMiles, intervalMin, start }) {
  S.settings.loopMiles = loopMiles;
  S.settings.intervalMin = intervalMin;
  S.active = { id: uid(), name, start, loopMiles, intervalMin, loops: [], created: Date.now(), cues: [], track: null };
  // Skip warnings that are already in the past when the race starts right away.
  if (start <= Date.now()) S.active.cues.push('1-w3', '1-w2', '1-w1', '1-go');
  save();
  unlockAudio();
  keepAwake();
  if (start <= Date.now()) { say('Loop 1. Go!'); }
  else if ('geolocation' in navigator) navigator.geolocation.getCurrentPosition(() => {}, () => {}, { enableHighAccuracy: true });
  raceKey = null;
  tick();
}

function completeLoop() {
  const r = S.active, now = Date.now();
  if (!r || phaseOf(r, now) !== 'running') return;
  const n = currentLoop(r);
  if (now >= loopDeadline(r, n)) { tick(); return; }
  const t = r.track && r.track.n === n ? r.track : null;
  r.loops.push({ n, start: loopStart(r, n), finish: now, meters: t ? Math.round(t.meters) : 0, route: t ? thinRoute(t.route) : [] });
  r.track = null;
  stopGPS();
  save();
  chime(); buzz([60, 40, 60]);
  const rest = loopStart(r, n + 1) - now;
  say(`Loop ${n} done in ${spoken(loopMs(r.loops[n - 1]))}. ${spoken(rest)} to rest.`);
  raceKey = null;
  tick();
}
function spoken(ms) {
  const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
  return m ? `${m} minute${m === 1 ? '' : 's'}${s ? ` ${s} second${s === 1 ? '' : 's'}` : ''}` : `${s} seconds`;
}

function endRace(reason, at = Date.now()) {
  const r = S.active;
  if (!r) return;
  stopGPS();
  releaseAwake();
  if (!reason) { // cancelled before anything was run
    S.active = null; save(); raceKey = null; renderAll(); toast('Race cancelled'); return;
  }
  const done = { id: r.id, name: r.name, start: r.start, loopMiles: r.loopMiles, intervalMin: r.intervalMin, loops: r.loops, end: at, endReason: reason };
  S.races.unshift(done);
  S.active = null;
  save();
  raceKey = null;
  renderAll();
  showSummary(done);
}

/* ---------- Clock ---------- */
let raceKey = null;
function tick() {
  const r = S.active;
  $('#live-dot').hidden = !r;
  if (!r) return;
  const now = Date.now();
  const n = currentLoop(r);
  if (now >= loopDeadline(r, n)) {
    if (now - loopDeadline(r, n) < 5000) { bell(); say(`Time is up. Loop ${n} was not finished.`); }
    endRace('cutoff', loopDeadline(r, n));
    return;
  }
  runCues(r, now);
  if (now >= loopStart(r, n)) {
    if (!r.track || r.track.n !== n) { r.track = { n, meters: 0, route: [], last: null, lastT: 0 }; save(); }
    if (gps.state !== 'denied') startGPS();
  } else if (watchId !== null) {
    stopGPS();
  }
  if (currentTab === 'race') renderRace(now);
}

/* ---------- Tabs ---------- */
let currentTab = 'race';
function showTab(name) {
  currentTab = name;
  $$('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  ['race', 'results', 'friends'].forEach(t => { $('#tab-' + t).hidden = t !== name; });
  raceKey = null;
  renderAll();
  window.scrollTo(0, 0);
}
$$('.tab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
function renderAll() {
  if (currentTab === 'race') renderRace(Date.now());
  if (currentTab === 'results') renderResults();
  if (currentTab === 'friends') renderFriends();
  $('#live-dot').hidden = !S.active;
}

/* ---------- Race tab ---------- */
function renderRace(now) {
  const el = $('#tab-race');
  const r = S.active;
  if (!r) {
    if (raceKey !== 'setup') { raceKey = 'setup'; el.innerHTML = setupHTML(); bindSetup(); }
    return;
  }
  const n = currentLoop(r), ph = phaseOf(r, now);
  const key = ph + ':' + n;
  if (raceKey !== key) {
    raceKey = key;
    el.innerHTML = ph === 'running' ? runningHTML(r, n) : waitingHTML(r, n);
    bindActive(r, n, ph);
  }
  updateActive(r, n, ph, now);
}

function nextTopOfHour() {
  const d = new Date(); d.setMinutes(0, 0, 0); d.setHours(d.getHours() + 1);
  return `${String(d.getHours()).padStart(2, '0')}:00`;
}
function setupHTML() {
  const ls = S.settings;
  const dist = Math.abs(ls.loopMiles - OFFICIAL_MI) < 0.001 ? 'official' : Math.abs(ls.loopMiles - 4) < 0.001 ? '4' : 'custom';
  const today = dateLabel(Date.now(), { month: 'short', day: 'numeric' });
  return `
  <div class="hero">
    <div class="eyebrow">Backyard ultra</div>
    <h1>Last one standing</h1>
    <p>Run a loop at the top of every hour. Hit <b>Done</b> when you finish it, rest, and go again when the clock says so. Miss the hour and you're out.</p>
  </div>
  <form id="setup" class="card" autocomplete="off">
    <label class="field"><span>Race name</span><input class="input" name="name" value="${esc('Backyard · ' + today)}" maxlength="60"></label>
    <div class="field"><span>Loop distance</span>
      <div class="seg" data-seg="dist">
        <button type="button" data-v="official" class="${dist === 'official' ? 'on' : ''}">4.167 mi</button>
        <button type="button" data-v="4" class="${dist === '4' ? 'on' : ''}">4 mi</button>
        <button type="button" data-v="custom" class="${dist === 'custom' ? 'on' : ''}">Custom</button>
      </div>
      <input class="input" name="custom" type="number" inputmode="decimal" step="0.01" min="0.1" placeholder="Miles per loop" value="${dist === 'custom' ? ls.loopMiles : ''}" ${dist === 'custom' ? '' : 'hidden'}>
    </div>
    <div class="field"><span>A new loop every</span>
      <div class="seg" data-seg="interval">
        ${[30, 45, 60, 90].map(v => `<button type="button" data-v="${v}" class="${ls.intervalMin === v ? 'on' : ''}">${v} min</button>`).join('')}
      </div>
    </div>
    <div class="field"><span>First loop starts</span>
      <div class="seg" data-seg="when">
        <button type="button" data-v="now" class="on">Right now</button>
        <button type="button" data-v="at">At a set time</button>
      </div>
      <input class="input" name="at" type="time" value="${nextTopOfHour()}" hidden>
    </div>
    <button class="btn primary big block" type="submit">Start race</button>
  </form>
  <div class="tip">${I.info}<div>Keep Backyard open on screen while you race. The app keeps your screen awake, whistles at 3, 2 and 1 minutes before each loop, and rings the bell at the start. iPhone pauses GPS for web apps when the screen locks.</div></div>`;
}
function bindSetup() {
  const f = $('#setup');
  $$('.seg', f).forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('button', seg).forEach(x => x.classList.toggle('on', x === b));
    if (seg.dataset.seg === 'dist') { f.custom.hidden = b.dataset.v !== 'custom'; if (!f.custom.hidden) f.custom.focus(); }
    if (seg.dataset.seg === 'when') f.at.hidden = b.dataset.v !== 'at';
  }));
  f.addEventListener('submit', e => {
    e.preventDefault();
    const v = k => $(`[data-seg="${k}"] .on`, f).dataset.v;
    const d = v('dist');
    const loopMiles = d === 'official' ? OFFICIAL_MI : d === '4' ? 4 : parseFloat(f.custom.value);
    if (!(loopMiles > 0)) { toast('Enter the loop distance in miles'); f.custom.focus(); return; }
    let start = Date.now();
    if (v('when') === 'at') {
      const [h, m] = (f.at.value || '').split(':').map(Number);
      if (isNaN(h)) { toast('Pick a start time'); return; }
      const d0 = new Date(); d0.setHours(h, m || 0, 0, 0);
      if (d0.getTime() <= Date.now()) d0.setDate(d0.getDate() + 1);
      start = d0.getTime();
    }
    startRace({ name: f.name.value.trim() || 'Backyard ultra', loopMiles, intervalMin: Number(v('interval')), start });
  });
}

function ring(id) {
  const C = 2 * Math.PI * 46;
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-track" cx="50" cy="50" r="46" fill="none" stroke-width="6"/>
    <circle id="${id}" class="ring-fill" cx="50" cy="50" r="46" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>`;
}
function setRing(el, frac) {
  const C = 2 * Math.PI * 46;
  el.setAttribute('stroke-dashoffset', String(C * (1 - Math.min(1, Math.max(0, frac)))));
}

function bindActive(r, n, ph) {
  $('#end-btn').addEventListener('click', () => {
    const running = ph === 'running';
    confirmSheet({
      title: r.loops.length ? 'End this race?' : 'Cancel this race?',
      body: running
        ? `Loop ${n} is in progress and won't count. You'll finish with ${r.loops.length} loop${r.loops.length === 1 ? '' : 's'}.`
        : r.loops.length ? `You'll finish with ${r.loops.length} loop${r.loops.length === 1 ? '' : 's'} (${mi(officialMiles(r))} mi). It will be saved to Results.` : 'Nothing has been run yet, so nothing will be saved.',
      ok: r.loops.length ? 'End race' : 'Cancel race', danger: true,
      onOk: () => endRace(running ? 'dnf' : (r.loops.length ? 'finished' : null)),
    });
  });
  const hold = $('#done-btn');
  if (hold) {
    let timer = null;
    const cancel = () => { clearTimeout(timer); timer = null; hold.classList.remove('pressing'); };
    hold.addEventListener('pointerdown', e => {
      e.preventDefault();
      unlockAudio();
      hold.classList.add('pressing'); buzz(15);
      timer = setTimeout(() => { cancel(); completeLoop(); }, 700);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => hold.addEventListener(t, cancel));
    hold.addEventListener('contextmenu', e => e.preventDefault());
    hold.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); completeLoop(); } });
  }
}

let lastRouteDraw = 0;
function updateActive(r, n, ph, now) {
  const left = $('#left'), callout = $('#callout'), ringEl = $('#ring');
  if (!left) return;
  const re = $('#race-elapsed');
  if (re) re.textContent = now >= r.start ? dur(now - r.start, { hours: true }) : '0:00:00';
  if (ph === 'running') {
    const st = loopStart(r, n), dl = loopDeadline(r, n), iv = intervalMs(r);
    const remain = dl - now, el = now - st;
    left.textContent = dur(remain, { up: true });
    $('#elapsed').textContent = `${dur(el)} elapsed`;
    setRing(ringEl, el / iv);
    ringEl.style.stroke = remain <= 5 * 60000 ? 'var(--danger)' : remain <= 10 * 60000 ? 'var(--warn)' : '';
    callout.className = 'callout ' + (remain <= 5 * 60000 ? 'danger' : remain <= 10 * 60000 ? 'warn' : el < 15000 ? 'go' : '');
    callout.textContent = remain <= 5 * 60000 ? 'Under 5 minutes — push to the finish!' : remain <= 10 * 60000 ? 'Under 10 minutes left' : el < 15000 ? 'GO!' : '';
    const t = r.track && r.track.n === n ? r.track : { meters: 0, route: [] };
    const m = t.meters / M_PER_MI;
    $('#dist').innerHTML = `${mi(m, 2)}<small>mi</small>`;
    $('#pace').innerHTML = m > 0.05 ? `${pace(el / m)}<small>/mi</small>` : '–';
    $('#prog').innerHTML = `${Math.min(100, Math.round(m / r.loopMiles * 100))}<small>%</small>`;
    const milesLeft = Math.max(0, r.loopMiles - m);
    $('#need').innerHTML = milesLeft > 0.01 ? `${pace(remain / milesLeft)}<small>/mi</small>` : 'Done!';
    const g = $('#gps');
    const gs = { good: ['good', `GPS locked · ±${Math.round(gps.accuracy)} m`], weak: ['', `Weak GPS signal · ±${Math.round(gps.accuracy || 0)} m`], searching: ['', 'Finding GPS…'], denied: ['bad', 'Location is off. Allow it in Settings › Safari › Location to track distance.'], unavailable: ['bad', 'GPS isn\'t available on this device'], off: ['', 'Starting GPS…'] }[gps.state] || ['', ''];
    g.className = 'gps ' + gs[0]; g.querySelector('span').textContent = gs[1];
    if (now - lastRouteDraw > 3000 || !$('#live-route').firstChild) {
      lastRouteDraw = now;
      $('#live-route').innerHTML = routeSVG([t.route], { live: true, empty: 'Your route will draw here as you run.' });
    }
  } else {
    const st = loopStart(r, n);
    const last = r.loops[r.loops.length - 1];
    const from = last ? last.finish : (r.created || now);
    const remain = st - now;
    left.textContent = dur(remain, { up: true });
    setRing(ringEl, (now - from) / Math.max(1, st - from));
    ringEl.style.stroke = remain <= 60000 ? 'var(--go)' : remain <= 180000 ? 'var(--warn)' : 'var(--rest)';
    callout.className = 'callout ' + (remain <= 60000 ? 'go' : remain <= 180000 ? 'warn' : '');
    callout.textContent = remain <= 60000 ? 'One minute — get to the start line' : remain <= 180000 ? 'Get to the corral!' : '';
  }
}

/* ---------- Route drawing ---------- */
function routeSVG(routes, { live = false, empty = 'No GPS route recorded.' } = {}) {
  const pts = routes.flat();
  if (pts.length < 2) return `<div class="route-empty">${esc(empty)}</div>`;
  let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
  for (const [la, lo] of pts) { minLat = Math.min(minLat, la); maxLat = Math.max(maxLat, la); minLon = Math.min(minLon, lo); maxLon = Math.max(maxLon, lo); }
  const k = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
  const W = 340, H = 160, pad = 14;
  const spanX = Math.max((maxLon - minLon) * k, 1e-6), spanY = Math.max(maxLat - minLat, 1e-6);
  const s = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
  const ox = (W - spanX * s) / 2, oy = (H - spanY * s) / 2;
  const P = ([la, lo]) => `${(ox + (lo - minLon) * k * s).toFixed(1)},${(oy + (maxLat - la) * s).toFixed(1)}`;
  const lines = routes.filter(rt => rt.length > 1).map((rt, i, arr) => {
    const latest = i === arr.length - 1;
    return `<polyline points="${rt.map(P).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="${latest ? 3 : 2}" stroke-linejoin="round" stroke-linecap="round" opacity="${latest ? 1 : 0.25}"/>`;
  }).join('');
  const first = pts[0], lastPt = routes[routes.length - 1][routes[routes.length - 1].length - 1] || pts[pts.length - 1];
  const [sx, sy] = P(first).split(','), [ex, ey] = P(lastPt).split(',');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Route map">
    ${lines}
    <circle cx="${sx}" cy="${sy}" r="5" fill="var(--go)" stroke="var(--card)" stroke-width="2"/>
    <circle cx="${ex}" cy="${ey}" r="${live ? 6 : 5}" fill="${live ? 'var(--accent)' : 'var(--text)'}" stroke="var(--card)" stroke-width="2"/>
  </svg>`;
}

/* ---------- Charts ---------- */
function niceScale(max, count = 4) {
  if (!(max > 0)) max = 1;
  const raw = max / count;
  const p = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw);
  const top = Math.ceil(max / step - 1e-9) * step;
  const ticks = [];
  for (let v = 0; v <= top + 1e-9; v += step) ticks.push(+v.toFixed(6));
  return { top, ticks };
}
function barPath(x, y, w, h, r = 4) {
  if (h <= 0) return '';
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
const CH = { h: 190, l: 34, r: 8, t: 18, b: 24 };

/* Stacked columns: [{label, segs:[{v, color, name}], tip}] */
function columnChart(el, data, { yFmt = v => v, yMax, stacked = false, labelMax = true } = {}) {
  const W = Math.max(280, el.clientWidth || 340), H = CH.h;
  const iw = W - CH.l - CH.r, ih = H - CH.t - CH.b;
  const totals = data.map(d => d.segs.reduce((a, s) => a + s.v, 0));
  const { top, ticks } = niceScale(yMax ?? Math.max(...totals, 0));
  const band = iw / Math.max(1, data.length);
  const bw = Math.max(3, Math.min(24, band - 2));
  const y = v => CH.t + ih - (v / top) * ih;
  const every = Math.ceil(data.length / Math.floor(iw / 30));
  const maxI = totals.indexOf(Math.max(...totals));
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  ticks.forEach(t => {
    svg += `<line class="${t === 0 ? 'baseline' : 'gridline'}" x1="${CH.l}" x2="${W - CH.r}" y1="${y(t)}" y2="${y(t)}"/>`;
    svg += `<text class="axis num" x="${CH.l - 6}" y="${y(t) + 4}" text-anchor="end">${esc(yFmt(t))}</text>`;
  });
  data.forEach((d, i) => {
    const x = CH.l + i * band + (band - bw) / 2;
    let acc = 0;
    d.segs.forEach((s, j) => {
      const last = j === d.segs.length - 1;
      const y0 = y(acc), y1 = y(acc + s.v);
      // 2px surface gap between stacked segments
      const h = Math.max(0, y0 - y1 - (j > 0 ? 2 : 0));
      if (h > 0) svg += last ? `<path d="${barPath(x, y1, bw, h)}" fill="${s.color}"/>` : `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" fill="${s.color}"/>`;
      acc += s.v;
    });
    if (i % every === 0 || i === data.length - 1) svg += `<text class="axis num" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(d.label)}</text>`;
    if (labelMax && i === maxI && !stacked && totals[i] > 0) svg += `<text class="mark-label num" x="${x + bw / 2}" y="${y(totals[i]) - 5}" text-anchor="middle">${esc(yFmt(totals[i], true))}</text>`;
    svg += `<rect class="hit" data-tip="${esc(d.tip)}" x="${CH.l + i * band}" y="${CH.t}" width="${band}" height="${ih}"/>`;
  });
  svg += '</svg>';
  el.innerHTML = svg;
  attachTips(el);
}

/* Line with dots: [{label, v, tip}] */
function lineChart(el, data, { yFmt = v => v, color = 'var(--rest)' } = {}) {
  const W = Math.max(280, el.clientWidth || 340), H = CH.h;
  const iw = W - CH.l - CH.r - 8, ih = H - CH.t - CH.b;
  const { top, ticks } = niceScale(Math.max(...data.map(d => d.v)));
  const x = i => CH.l + 8 + (data.length === 1 ? iw / 2 : (i / (data.length - 1)) * iw);
  const y = v => CH.t + ih - (v / top) * ih;
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  ticks.forEach(t => {
    svg += `<line class="${t === 0 ? 'baseline' : 'gridline'}" x1="${CH.l}" x2="${W - CH.r}" y1="${y(t)}" y2="${y(t)}"/>`;
    svg += `<text class="axis num" x="${CH.l - 6}" y="${y(t) + 4}" text-anchor="end">${esc(yFmt(t))}</text>`;
  });
  const pts = data.map((d, i) => `${x(i).toFixed(1)},${y(d.v).toFixed(1)}`);
  if (data.length > 1) {
    svg += `<path d="M${pts[0]}L${pts.slice(1).join('L')}L${x(data.length - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="${color}" opacity=".1"/>`;
    svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  const every = Math.ceil(data.length / Math.floor(iw / 44));
  data.forEach((d, i) => {
    svg += `<circle cx="${x(i)}" cy="${y(d.v)}" r="4" fill="${color}" stroke="var(--card)" stroke-width="2"/>`;
    if (i % every === 0 || i === data.length - 1) svg += `<text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  const end = data[data.length - 1];
  svg += `<text class="mark-label num" x="${x(data.length - 1)}" y="${y(end.v) - 9}" text-anchor="${data.length > 1 ? 'end' : 'middle'}">${esc(yFmt(end.v, true))}</text>`;
  const band = data.length === 1 ? iw : iw / (data.length - 1);
  data.forEach((d, i) => { svg += `<rect class="hit" data-tip="${esc(d.tip)}" x="${x(i) - band / 2}" y="${CH.t}" width="${band}" height="${ih}"/>`; });
  svg += '</svg>';
  el.innerHTML = svg;
  attachTips(el);
}

function attachTips(el) {
  let tip = null;
  const show = target => {
    if (!target || !target.dataset.tip) { hide(); return; }
    tip = tip || el.appendChild(Object.assign(document.createElement('div'), { className: 'tooltip' }));
    tip.innerHTML = target.dataset.tip.split('|').map(esc).join('<br>');
    const box = el.getBoundingClientRect(), t = target.getBoundingClientRect();
    let left = t.left + t.width / 2 - box.left;
    tip.style.left = left + 'px';
    tip.style.top = (CH.t + 6) + 'px';
    const tb = tip.getBoundingClientRect();
    if (tb.left < box.left) tip.style.left = (left + box.left - tb.left) + 'px';
    if (tb.right > box.right) tip.style.left = (left - (tb.right - box.right)) + 'px';
    $$('.hit', el).forEach(h => h.style.fill = h === target ? 'color-mix(in srgb, var(--text) 6%, transparent)' : '');
  };
  const hide = () => { tip?.remove(); tip = null; $$('.hit', el).forEach(h => h.style.fill = ''); };
  el.addEventListener('pointermove', e => show(document.elementFromPoint(e.clientX, e.clientY)?.closest?.('.hit')));
  el.addEventListener('pointerdown', e => show(e.target.closest('.hit')));
  el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
}
document.addEventListener('pointerdown', e => {
  $$('.chart .tooltip').forEach(t => {
    const chart = t.parentElement;
    if (!chart.contains(e.target)) { t.remove(); $$('.hit', chart).forEach(h => h.style.fill = ''); }
  });
});
const minFmt = (v, full) => full ? dur(v * 60000) : `${v}m`;

      <div class="tile"><div class="label">Race time</div><div class="value num">${dur(st.elapsed, { hours: true })}</div></div>
      <div class="tile"><div class="label">Avg loop</div><div class="value num">${st.avg ? dur(st.avg) : '–'}</div></div>
      <div class="tile"><div class="label">Fastest</div><div class="value num">${st.fastest ? dur(st.fastest) : '–'}</div></div>
      <div class="tile"><div class="label">GPS miles</div><div class="value num">${st.gpsMiles ? mi(st.gpsMiles) : '–'}</div></div>
    </div>
    ${r.loops.length ? `
    <div class="card">
      <h2>Running vs. rest</h2>
      <div class="legend"><span><i style="background:var(--run)"></i>Running</span><span><i style="background:var(--rest)"></i>Rest</span></div>
      <div class="chart" id="ch-split"></div>
      <button class="table-toggle" id="tbl-toggle">Show as table</button>
      <div id="tbl" hidden></div>
    </div>
    <div class="section-title">Route</div>
    <div class="route-box">${routeSVG(r.loops.map(l => l.route || []))}</div>
    <div class="card"><h2>Splits</h2>${loopListHTML(r)}</div>` : '<div class="card muted">No loops were finished in this race.</div>'}
    <div class="row-btns" style="margin-top:12px"><button class="btn" id="d-rename">Rename</button><button class="btn danger" id="d-delete">Delete</button></div>
  </div>`;
  document.body.appendChild(page);
  document.body.style.overflow = 'hidden';
  const close = () => { page.remove(); document.body.style.overflow = ''; renderAll(); };
  $('#d-back', page).addEventListener('click', close);
  if (r.loops.length) {
    columnChart($('#ch-split', page), r.loops.map(l => {
      const run = loopMs(l) / 60000, rest = Math.max(0, r.intervalMin - run);
      return { label: String(l.n), segs: [{ v: run, color: 'var(--run)' }, { v: rest, color: 'var(--rest)' }], tip: `Loop ${l.n}|Running ${dur(loopMs(l))}|Rest ${dur(rest * 60000)}` };
    }), { yFmt: v => `${v}m`, yMax: r.intervalMin, stacked: true });
    $('#tbl-toggle', page).addEventListener('click', e => {
      const t = $('#tbl', page); t.hidden = !t.hidden; e.target.textContent = t.hidden ? 'Show as table' : 'Hide table';
      if (!t.innerHTML) t.innerHTML = `<table class="data num"><thead><tr><th>Loop</th><th>Running</th><th>Rest</th><th>Pace</th></tr></thead><tbody>${r.loops.map(l => `<tr><td>${l.n}</td><td>${dur(loopMs(l))}</td><td>${dur(loopDeadline(r, l.n) - l.finish)}</td><td>${pace(loopMs(l) / r.loopMiles)}</td></tr>`).join('')}</tbody></table>`;
    });
  }
  $('#d-share', page).addEventListener('click', () => shareText(`${r.name} — ${st.loops} loops, ${mi(st.miles)} miles of backyard ultra in ${dur(st.elapsed, { hours: true })}${st.fastest ? `. Fastest loop ${dur(st.fastest)}` : ''}. 🏃`));
  $('#d-rename', page).addEventListener('click', () => promptSheet({ title: 'Rename race', value: r.name, ok: 'Save', onOk: v => { r.name = v || r.name; save(); close(); openRace(r.id); } }));
  $('#d-delete', page).addEventListener('click', () => confirmSheet({ title: 'Delete this race?', body: 'Its loops and route are removed for good.', ok: 'Delete', danger: true, onOk: () => { S.races = S.races.filter(x => x.id !== r.id); save(); close(); } }));
}

/* ---------- Friends ---------- */
let boardMetric = 'best';
function myCard() {
  const c = career();
  return { i: S.profile.id, n: S.profile.name || 'Runner', s: { r: c.races, b: c.best, l: c.loops, m: +c.miles.toFixed(1), f: c.fastest ? Math.round(c.fastest / 1000) : null, d: c.last }, t: Date.now() };
}
function b64u(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
function inviteCode() { return 'BYU1' + b64u(JSON.stringify(myCard())); }
function inviteLink() { return location.href.split('#')[0] + '#add=' + inviteCode(); }
function parseInvite(text) {
  const m = /BYU1([A-Za-z0-9_-]+)/.exec(text || '');
  if (!m) return null;
  try {
    const c = JSON.parse(unb64u(m[1]));
    if (!c || typeof c.i !== 'string' || typeof c.n !== 'string' || !c.s) return null;
    return c;
  } catch (e) { return null; }
}
function cardToFriend(c) {
  const s = c.s || {};
  return { id: c.i, name: c.n.slice(0, 40), updated: c.t || Date.now(), stats: { races: +s.r || 0, best: +s.b || 0, loops: +s.l || 0, miles: +s.m || 0, fastest: s.f ? s.f * 1000 : null, last: s.d || null } };
}
function addFriendFromCard(c) {
  if (c.i === S.profile.id) { toast("That's your own invite"); return false; }
  const f = cardToFriend(c);
  const i = S.friends.findIndex(x => x.id === f.id);
  if (i >= 0) { f.added = S.friends[i].added; S.friends[i] = f; toast(`Updated ${f.name}'s stats`); }
  else { f.added = Date.now(); S.friends.push(f); toast(`${f.name} added`); }
  save();
  return true;
}

function boardRows() {
  const c = career();
  const me = { id: S.profile.id, name: S.profile.name || 'You', me: true, stats: { races: c.races, best: c.best, loops: c.loops, miles: c.miles, fastest: c.fastest, last: c.last } };
  const rows = [me, ...S.friends];
  const val = { best: r => r.stats.best, miles: r => r.stats.miles, fastest: r => r.stats.fastest }[boardMetric];
  rows.sort((a, b) => {
    const va = val(a), vb = val(b);
    if (boardMetric === 'fastest') return (va ?? Infinity) - (vb ?? Infinity);
    return (vb || 0) - (va || 0);
  });
  return rows;
}
function scoreHTML(row) {
  const s = row.stats;
  if (boardMetric === 'best') return `${s.best}<small>loops</small>`;
  if (boardMetric === 'miles') return `${mi(s.miles)}<small>miles</small>`;
  return `${s.fastest ? dur(s.fastest) : '–'}<small>fastest loop</small>`;
}

function renderFriends() {
  const el = $('#tab-friends');
  const rows = boardRows();
  el.innerHTML = `
    <div class="topbar"><h1>Friends</h1><button class="icon-btn" id="f-add" aria-label="Add friend">${I.plus}</button></div>
    <div class="card">
      <div class="me-card">
        <div class="avatar">${esc(initials(S.profile.name || 'You'))}</div>
        <div style="flex:1;min-width:0">
          <input class="input" id="my-name" placeholder="Your name" value="${esc(S.profile.name)}" maxlength="40" autocomplete="name">
          <div class="small muted" style="margin-top:6px">Friend code <span class="code">${friendCode(S.profile.id)}</span></div>
        </div>
      </div>
      <div class="row-btns" style="margin-top:14px">
        <button class="btn primary" id="f-invite">${I.share}Invite friends</button>
      </div>
    </div>
    <div class="section-title">Leaderboard</div>
    <div class="card">
      <div class="seg" id="board-seg" style="margin-bottom:8px">
        <button type="button" data-v="best" class="${boardMetric === 'best' ? 'on' : ''}">Most loops</button>
        <button type="button" data-v="miles" class="${boardMetric === 'miles' ? 'on' : ''}">Total miles</button>
        <button type="button" data-v="fastest" class="${boardMetric === 'fastest' ? 'on' : ''}">Fastest loop</button>
      </div>
      <ul class="board">${rows.map((r, i) => `
        <li class="${r.me ? 'me' : ''}">
          <span class="rank num ${i === 0 ? 'top' : ''}">${i + 1}</span>
          <span class="avatar sm">${esc(initials(r.name))}</span>
          <button class="who" data-id="${esc(r.id)}" ${r.me ? 'disabled' : ''}><b>${esc(r.name)}</b><span>${r.stats.races} race${r.stats.races === 1 ? '' : 's'}${r.me ? '' : ` · updated ${dateLabel(r.updated, { month: 'short', day: 'numeric' })}`}</span></button>
          <span class="score num">${scoreHTML(r)}</span>
        </li>`).join('')}
      </ul>
      ${S.friends.length ? '' : `<div class="empty" style="padding:24px 8px 8px">${I.friends}<h3>Race your friends</h3><p>Send an invite. When a friend opens it, they're on your board. Ask them to share theirs back so you're on theirs.</p></div>`}
    </div>
    <div class="tip">${I.info}<div>Friends' stats update whenever they send you a fresh invite after a race. Nothing leaves your phone unless you share it.</div></div>`;
  const nameInput = $('#my-name');
  nameInput.addEventListener('change', () => { S.profile.name = nameInput.value.trim(); save(); renderFriends(); });
  $('#f-invite').addEventListener('click', invite);
  $('#f-add').addEventListener('click', addFriendSheet);
  $('#board-seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { boardMetric = b.dataset.v; renderFriends(); } });
  $$('.board button.who:not([disabled])', el).forEach(b => b.addEventListener('click', () => friendSheet(b.dataset.id)));
}

async function invite() {
  if (!S.profile.name) { toast('Add your name first'); $('#my-name').focus(); return; }
  const c = career();
  const text = `Race me on Backyard! My best is ${c.best} loop${c.best === 1 ? '' : 's'} (${mi(c.bestRace ? officialMiles(c.bestRace) : 0)} mi). Tap to add me, or paste this code in Friends › +:`;
  const link = inviteLink();
  if (navigator.share) {
    try { await navigator.share({ title: 'Backyard invite', text: `${text}\n${link}` }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  copy(`${text}\n${link}`, 'Invite copied — paste it in a message');
}
async function copy(text, msg = 'Copied') {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch (e) {
    const ta = Object.assign(document.createElement('textarea'), { value: text });
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(msg);
  }
}
async function shareText(text) {
  if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  copy(text);
}

function addFriendSheet() {
  const sh = sheet(`
    <h2>Add a friend</h2>
    <p>Paste the invite message or code your friend sent you.</p>
    <textarea class="input" id="inv-text" placeholder="Paste invite here"></textarea>
    <button class="btn block" id="inv-paste" style="margin-top:10px">Paste from clipboard</button>
    <button class="btn primary block" id="inv-add">Add friend</button>
    <p class="small" style="margin-top:14px">Don't have one? Tap <b>Invite friends</b> to send yours first — they'll send theirs back.</p>`);
  const ta = $('#inv-text', sh.el);
  $('#inv-paste', sh.el).addEventListener('click', async () => {
    try { ta.value = await navigator.clipboard.readText(); } catch (e) { toast('Long-press the box and tap Paste'); ta.focus(); }
  });
  $('#inv-add', sh.el).addEventListener('click', () => {
    const c = parseInvite(ta.value);
    if (!c) { toast("That doesn't look like a Backyard invite"); return; }
    if (addFriendFromCard(c)) { sh.close(); renderFriends(); }
  });
}

function friendSheet(id) {
  const f = S.friends.find(x => x.id === id);
  if (!f) return;
  const c = career();
  const cmp = (label, mine, theirs, fmt, lowerWins = false) => {
    const win = mine != null && theirs != null && mine !== theirs && ((lowerWins ? mine < theirs : mine > theirs));
    return `<tr><td>${label}</td><td style="${win ? 'font-weight:800' : ''}">${mine != null ? fmt(mine) : '–'}</td><td style="${!win && mine !== theirs && theirs != null ? 'font-weight:800' : ''}">${theirs != null ? fmt(theirs) : '–'}</td></tr>`;
  };
  const sh = sheet(`
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
      <div class="avatar">${esc(initials(f.name))}</div>
      <div><h2 style="margin:0">${esc(f.name)}</h2><div class="small muted">Code <span class="code">${friendCode(f.id)}</span> · updated ${dateLabel(f.updated)}</div></div>
    </div>
    <table class="data num" style="margin-bottom:16px">
      <thead><tr><th></th><th>You</th><th>${esc(f.name.split(' ')[0])}</th></tr></thead>
      <tbody>
        ${cmp('Most loops', c.best, f.stats.best, v => v)}
        ${cmp('Total miles', c.miles, f.stats.miles, v => mi(v))}
        ${cmp('Total loops', c.loops, f.stats.loops, v => v)}
        ${cmp('Fastest loop', c.fastest, f.stats.fastest, v => dur(v), true)}
        ${cmp('Races', c.races, f.stats.races, v => v)}
      </tbody>
    </table>
    <button class="btn primary block" id="fr-invite">${I.share}Send my latest stats</button>
    <button class="btn danger block" id="fr-remove">Remove friend</button>`);
  $('#fr-invite', sh.el).addEventListener('click', () => { sh.close(); invite(); });
  $('#fr-remove', sh.el).addEventListener('click', () => { S.friends = S.friends.filter(x => x.id !== id); save(); sh.close(); renderFriends(); toast(`${f.name} removed`); });
}

// Opening an invite link (#add=BYU1...)
function handleInviteHash() {
  const m = /[#&]add=(BYU1[A-Za-z0-9_-]+)/.exec(location.hash);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  const c = parseInvite(m[1]);
  if (!c) { toast("That invite link didn't work"); return; }
  if (c.i === S.profile.id) { toast("That's your own invite"); return; }
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const sh = sheet(`<div class="sheet-center">
    <div class="avatar" style="margin:4px auto 10px;width:64px;height:64px;font-size:24px">${esc(initials(c.n))}</div>
    <h2>Add ${esc(c.n)}?</h2>
    <p>Best: ${+c.s.b || 0} loop${+c.s.b === 1 ? '' : 's'} · ${+c.s.m || 0} miles · ${+c.s.r || 0} race${+c.s.r === 1 ? '' : 's'}</p></div>
    <button class="btn primary block" id="inv-yes">Add friend</button>
    ${standalone ? '' : `<button class="btn block" id="inv-copy">Copy invite code</button>
    <p class="small" style="margin-top:12px">Using Backyard from your Home Screen? It keeps its own data, so copy the code, open the Home Screen app, and paste it in Friends › +.</p>`}`);
  $('#inv-yes', sh.el).addEventListener('click', () => { addFriendFromCard(c); sh.close(); showTab('friends'); });
  $('#inv-copy', sh.el)?.addEventListener('click', () => copy(m[1], 'Code copied'));
}

/* ---------- Sheets ---------- */
function sheet(html, { onClose } = {}) {
  const bd = document.createElement('div');
  bd.className = 'backdrop';
  bd.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grabber"></div>${html}</div>`;
  document.body.appendChild(bd);
  const close = () => { bd.remove(); onClose && onClose(); };
  bd.addEventListener('click', e => { if (e.target === bd) close(); });
  return { el: bd, close };
}
function confirmSheet({ title, body, ok, danger, onOk }) {
  const sh = sheet(`<h2>${esc(title)}</h2><p>${esc(body)}</p>
    <button class="btn block ${danger ? 'danger' : 'primary'}" id="c-ok">${esc(ok)}</button>
    <button class="btn block" id="c-cancel">Keep going</button>`);
  $('#c-ok', sh.el).addEventListener('click', () => { sh.close(); onOk(); });
  $('#c-cancel', sh.el).addEventListener('click', sh.close);
}
function promptSheet({ title, value, ok, onOk }) {
  const sh = sheet(`<h2>${esc(title)}</h2><input class="input" id="p-val" value="${esc(value)}" maxlength="60" style="margin:8px 0 14px">
    <button class="btn primary block" id="p-ok">${esc(ok)}</button>`);
  $('#p-ok', sh.el).addEventListener('click', () => { const v = $('#p-val', sh.el).value.trim(); sh.close(); onOk(v); });
}
function showSummary(r) {
  const st = raceStats(r);
  const pb = S.races.length > 1 && st.loops > 0 && st.loops >= Math.max(...S.races.filter(x => x.id !== r.id).map(x => x.loops.length));
  const sh = sheet(`<div class="sheet-center">
    <span class="trophy">${I.trophy}</span>
    <h2>${r.endReason === 'cutoff' ? `Out after ${st.loops} loop${st.loops === 1 ? '' : 's'}` : `${st.loops} loop${st.loops === 1 ? '' : 's'} done`}</h2>
    <p>${r.endReason === 'cutoff' ? `Loop ${st.loops + 1} wasn't finished before the hour was up.` : r.endReason === 'dnf' ? `You stopped during loop ${st.loops + 1}.` : 'Race over. Nice running.'}${pb ? ' New personal best!' : ''}</p></div>
    <div class="tiles three">
      <div class="tile"><div class="label">Distance</div><div class="value num">${mi(st.miles)}<small>mi</small></div></div>
      <div class="tile"><div class="label">Avg loop</div><div class="value num">${st.avg ? dur(st.avg) : '–'}</div></div>
      <div class="tile"><div class="label">Race time</div><div class="value num">${dur(st.elapsed, { hours: true })}</div></div>
    </div>
    <button class="btn primary block" id="s-view">See results</button>
    <button class="btn block" id="s-share">${I.share}Share</button>`);
  $('#s-view', sh.el).addEventListener('click', () => { sh.close(); resultsView = 'races'; showTab('results'); openRace(r.id); });
  $('#s-share', sh.el).addEventListener('click', () => shareText(`I ran ${st.loops} loops (${mi(st.miles)} miles) at ${r.name}! 🏃`));
}

/* ---------- Backup ---------- */
function backupSheet() {
  const sh = sheet(`<h2>Back up & restore</h2>
    <p>Races and friends are stored only on this phone. Save a backup now and then.</p>
    <button class="btn primary block" id="b-save">Back up</button>
    <button class="btn block" id="b-load">Restore from file</button>
    <input type="file" id="b-file" accept="application/json,.json" hidden>
    <label class="field" style="display:flex;justify-content:space-between;align-items:center;margin:18px 0 0">
      <span style="margin:0;font-size:15px;color:var(--text);font-weight:600">Whistles &amp; voice cues</span>
      <input type="checkbox" id="b-sound" ${S.settings.sound ? 'checked' : ''} style="width:22px;height:22px;accent-color:var(--accent)">
    </label>`);
  $('#b-sound', sh.el).addEventListener('change', e => { S.settings.sound = e.target.checked; save(); });
  $('#b-save', sh.el).addEventListener('click', async () => {
    const data = JSON.stringify({ app: 'backyard', v: 1, exported: Date.now(), profile: S.profile, races: S.races, friends: S.friends });
    const name = `backyard-backup-${new Date().toISOString().slice(0, 10)}.json`;
    const file = new File([data], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Backyard backup' }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(file), download: name });
    document.body.appendChild(a); a.click(); a.remove();
  });
  $('#b-load', sh.el).addEventListener('click', () => $('#b-file', sh.el).click());
  $('#b-file', sh.el).addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (d.app !== 'backyard' || !Array.isArray(d.races)) throw new Error('bad');
      const ids = new Set(S.races.map(r => r.id));
      const added = d.races.filter(r => !ids.has(r.id));
      S.races = [...S.races, ...added].sort((a, b) => b.start - a.start);
      const fids = new Set(S.friends.map(x => x.id));
      S.friends = [...S.friends, ...(d.friends || []).filter(x => !fids.has(x.id))];
      if (!S.profile.name && d.profile?.name) S.profile = d.profile;
      save(); sh.close(); renderAll();
      toast(`Restored ${added.length} race${added.length === 1 ? '' : 's'}`);
    } catch (err) { toast("That file isn't a Backyard backup"); }
  });
}

/* ---------- Boot ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    keepAwake();
    raceKey = null;
    tick();
  }
});
document.addEventListener('pointerdown', () => { if (S.active) { unlockAudio(); keepAwake(); } }, { passive: true });
window.addEventListener('hashchange', handleInviteHash);

if (S.active) {
  // Reopened mid-race: GPS restarts on the next tick if a loop is running.
  if (S.active.track && S.active.track.n !== currentLoop(S.active)) S.active.track = null;
}
renderAll();
tick();
setInterval(tick, 250);
handleInviteHash();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
